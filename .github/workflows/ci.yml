name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Local D1 migrations and scheduled smoke
        run: npm run ops:smoke
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Secret scan
        run: npm run secret-scan
