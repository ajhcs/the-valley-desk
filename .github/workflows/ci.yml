name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Locked install
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hash-locked PDF extraction tools
        run: npm run policy:pdf:bootstrap
      - name: Private acquisition test workspace
        run: test -d /workspace/build/builderbob || sudo install -d -m 0700 -o "$USER" -g "$(id -gn)" /workspace/build/builderbob
      - name: Core and assistant tests
        run: npm run test:core && npm run test:assistant
      - name: Mandatory official PDF byte regressions
        run: npm run test:policy-pdf
      - name: Typecheck and production build
        run: npm run build
      - name: Local D1 migrations and scheduled smoke
        run: npm run ops:smoke
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Secret scan
        run: npm run secret-scan
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Locked install
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Private acquisition test workspace
        run: test -d /workspace/build/builderbob || sudo install -d -m 0700 -o "$USER" -g "$(id -gn)" /workspace/build/builderbob
      - name: Daily directory refresh tests
        run: python3 -B -m unittest discover -s ops -p 'test_daily*.py'
      - name: Directory and discovery tests
        run: npm run test:discovery
